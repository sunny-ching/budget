<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="記帳本">
<title>記帳本</title>
<link rel="apple-touch-icon" href="budget-icon.png">
<link rel="icon" type="image/png" href="budget-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F2E7;
    --paper-line:#DCD4BC;
    --ink:#232C25;
    --ink-soft:#5B6459;
    --green:#1F6F4A;
    --green-deep:#164F35;
    --gold:#9C7A1E;
    --red:#B33A2E;
    --card:#FFFDF7;
    --shadow: 0 1px 0 rgba(35,44,37,0.06);
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--paper);
    background-image: repeating-linear-gradient(
      to bottom, transparent, transparent 35px, var(--paper-line) 35px, var(--paper-line) 36px
    );
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  header{
    padding: 28px 20px 14px;
    border-bottom: 3px double var(--green-deep);
  }
  header h1{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size: 28px;
    margin:0 0 4px;
    color: var(--green-deep);
    letter-spacing: 1px;
  }
  header p{
    margin:0;
    font-size:13px;
    color:var(--ink-soft);
  }
  #warn{
    margin:12px 16px 0;
    padding:10px 14px;
    border-radius:8px;
    border-left:5px solid var(--red);
    background:#FBEAE7;
    font-size:13.5px;
    line-height:1.6;
  }
  nav{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding: 12px 16px 0;
  }
  nav button{
    font-family:'Noto Serif TC', serif;
    font-size:14px;
    padding:9px 16px 8px;
    border:1px solid var(--green-deep);
    border-bottom:none;
    background: #EDE7D6;
    color:var(--green-deep);
    cursor:pointer;
    border-radius:6px 6px 0 0;
    position:relative;
    top:1px;
  }
  nav button.active{
    background: var(--card);
    color:var(--ink);
    font-weight:700;
  }
  main{
    max-width: 880px;
    margin: 0 auto;
    padding: 18px 16px 60px;
  }
  .panel{
    background: var(--card);
    border:1px solid var(--green-deep);
    border-radius: 0 8px 8px 8px;
    padding: 18px 18px 22px;
    box-shadow: var(--shadow);
    overflow-x:auto;
  }
  h2{
    font-family:'Noto Serif TC', serif;
    font-size:19px;
    margin: 0 0 4px;
    color: var(--green-deep);
  }
  .hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 16px;
    line-height:1.6;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
    margin-bottom:16px;
  }
  th{
    text-align:left;
    font-weight:700;
    font-size:12.5px;
    color:var(--green-deep);
    border-bottom:2px solid var(--green-deep);
    padding:6px 8px;
    white-space:nowrap;
  }
  td{
    padding:7px 8px;
    border-bottom:1px solid var(--paper-line);
  }
  td.num, th.num{ text-align:right; font-variant-numeric: tabular-nums; white-space:nowrap; }
  tr:hover td{ background: rgba(31,111,74,0.05); }
  .del-btn{
    background:none;
    border:1px solid var(--red);
    color:var(--red);
    border-radius:5px;
    font-size:12px;
    padding:2px 8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .del-btn:hover{ background: var(--red); color:#fff; }
  .add-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:flex-end;
    padding-top:12px;
    border-top: 1px dashed var(--paper-line);
  }
  .field{ display:flex; flex-direction:column; gap:3px; }
  .field.wide{ flex:1 1 100%; }
  .field label{ font-size:11.5px; color:var(--ink-soft); }
  select, input{
    font-family:'Noto Sans TC', sans-serif;
    font-size:13.5px;
    padding:7px 8px;
    border:1px solid #C9C2AC;
    border-radius:5px;
    background:#fff;
    color:var(--ink);
  }
  @media (max-width:640px){
    /* 16px keeps iPhone Safari from zooming in when a field is focused */
    select, input{ font-size:16px; }
  }
  input[type=number]{ width:110px; }
  input[type=date], input[type=month]{ width:150px; }
  .chk-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .field label.chk{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px 6px 9px;
    border:1px solid #C9C2AC; border-radius:16px; background:#fff;
    font-size:14px; color:var(--ink); cursor:pointer;
  }
  .chk input{ width:18px; height:18px; padding:0; margin:0; accent-color: var(--green); }
  .btn{
    font-family:'Noto Serif TC', serif;
    background: var(--green);
    color:#fff;
    border:none;
    border-radius:5px;
    padding:8px 16px;
    font-size:13.5px;
    cursor:pointer;
    font-weight:700;
  }
  .btn:hover{ background: var(--green-deep); }
  .btn:disabled{ opacity:0.45; cursor:default; }
  .btn:disabled:hover{ background: var(--green); }
  .btn.secondary{
    background:#fff;
    color:var(--green-deep);
    border:1px solid var(--green-deep);
  }
  .btn.secondary:hover{ background:#EDE7D6; }
  .btn.secondary:disabled:hover{ background:#fff; }
  .btn.small{ padding:3px 10px; font-size:12px; }
  .total-row td{
    font-weight:700;
    border-top:2px solid var(--green-deep);
    border-bottom:none;
  }
  .grid2{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:14px;
  }
  @media (max-width:640px){ .grid2{ grid-template-columns: 1fr; } }
  .stat{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:8px;
    padding:12px 14px;
  }
  .stat .label{ font-size:12px; color:var(--ink-soft); }
  .stat .value{ font-size:22px; font-weight:700; font-family:'Noto Serif TC',serif; margin-top:2px; }
  .advice{
    margin-top:16px;
    padding:14px 16px;
    border-radius:8px;
    border-left:5px solid var(--gold);
    background: #FBF6E3;
    font-size:14px;
    line-height:1.7;
  }
  .advice.warn{ border-left-color:var(--red); background:#FBEAE7; }
  .advice.good{ border-left-color:var(--green); background:#EAF4EE; }
  .note{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; line-height:1.6; }
  .member-tag{
    display:inline-block;
    background:#EDE7D6;
    border-radius:4px;
    padding:1px 7px;
    font-size:12px;
    color:var(--green-deep);
    white-space:nowrap;
  }
  .split-tag{
    display:inline-block;
    background:#EAF4EE;
    color:var(--green-deep);
    border-radius:4px;
    padding:0 6px;
    font-size:11.5px;
    white-space:nowrap;
  }
  .pending-tag{
    display:inline-block;
    background:#FBF6E3;
    color:var(--gold);
    border-radius:4px;
    padding:0 6px;
    font-size:11.5px;
    white-space:nowrap;
  }
  .settings-block{ margin-bottom:22px; }
  .chip-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip{
    display:flex; align-items:center; gap:6px;
    background:#EDE7D6; border-radius:16px; padding:4px 6px 4px 12px; font-size:13px;
  }
  .chip button{
    background:none; border:none; color:var(--red); cursor:pointer; font-size:13px; padding:0 4px;
  }
  .loading{ padding:60px 20px; text-align:center; color:var(--ink-soft); font-family:'Noto Serif TC',serif; }
  .empty{ color:var(--ink-soft); font-size:13px; padding:10px 0; }
  .backup-msg{ font-size:13px; color:var(--ink-soft); margin-top:8px; min-height:1.2em; }
  [hidden]{ display:none !important; }
  .dlg-overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(20,30,24,0.45);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .dlg-box{
    background:var(--card);
    border:1px solid var(--green-deep);
    border-radius:10px;
    padding:18px;
    max-width:380px; width:100%;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
  }
  .edit-btn{
    background:none; border:1px solid var(--green-deep); color:var(--green-deep);
    border-radius:5px; font-size:12px; padding:2px 8px; cursor:pointer; white-space:nowrap; margin-right:4px;
  }
  .edit-btn:hover{ background:var(--green-deep); color:#fff; }
  .dlg-box.wide{ max-width:460px; max-height:90vh; overflow-y:auto; }
  .edit-form{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .edit-form .field input, .edit-form .field select{ width:100%; }
  .dlg-msg{ margin:0 0 16px; font-size:15px; line-height:1.7; }
  .dlg-actions{ display:flex; gap:8px; justify-content:flex-end; }
</style>
</head>
<body>
<header>
  <h1>記帳本 · 月月都能用</h1>
  <p>固定支出設定一次就好，每天只要記帳和看建議 — 資料自動儲存在這個瀏覽器，下個月還在</p>
</header>
<div id="warn" hidden></div>
<div id="dialog" class="dlg-overlay" hidden></div>
<nav id="tabs"></nav>
<main><div class="panel" id="content"><div class="loading">讀取資料中…</div></div></main>

<script>
const STORAGE_KEY = 'budget-app-state-v1';
const STATE_VERSION = 7;

const DEFAULT_CATEGORIES = {
  "餐飲": ["早餐","午餐","晚餐","飲料","零食"],
  "交通": ["大眾運輸","計程車","加油","停車費"],
  "日用品": ["衛生紙","清潔用品","盥洗用品","保養品"],
  "娛樂": ["電影","遊戲","訂閱服務","潛水","旅遊","唱歌"],
  "醫療": ["掛號費","藥品","保健品"],
  "教育": ["書籍","課程","文具"],
  "居住": ["房租","水電瓦斯","網路費","管理費"],
  "保險稅務": ["汽車保險","健康保險","牌照稅","房屋稅"],
  "其他": ["其他"],
  "狗狗": ["飼料","魚油","益生菌","骨頭保健","其他保健品","玩具"]
};
const INCOME_TYPES = ["基本月薪","加班費","獎金","投資收益","代墊款項","利息收入","其他"];
// 帳戶別：選到「銀行」時，才會再出現銀行別下拉選單
const BANK_ACCOUNT = '銀行';   // 固定要選銀行別，不能取消
const DEFAULT_BANK_ACCOUNTS = ['銀行','信用卡','行動支付'];
const DEFAULT_ACCOUNTS = ['現金','銀行','信用卡','行動支付'];
const DEFAULT_BANKS = ['台灣銀行','中國信託','玉山銀行','國泰世華','台新銀行','郵局'];
const LIST_KEYS = ['fixedItems','fixedIncomes','variableItems','dailyExpenses','incomes'];
// 固定花費的繳費頻率 → 換算成每日成本的除數
const FREQS = { month:{label:'每月', days:30}, week:{label:'每週', days:7}, year:{label:'每年', days:365} };

// 晴的寶庫：分攤規則
const TREASURE_MEMBER = '晴';
const FOOD_CATEGORY = '餐飲';
const FOOD_RATE = 0.35;
const DEFAULT_RATE = 0.5;

let state = null;
let activeTab = 'overview';

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function pad2(n){ return String(n).padStart(2,'0'); }
// Local date, not UTC: toISOString() would give "yesterday" in Taiwan before 08:00.
function localDateStr(d){ d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function todayStr(){ return localDateStr(); }
function thisMonthStr(){ return todayStr().slice(0,7); }
function money(n){ return 'NT$' + Math.round(n||0).toLocaleString('zh-TW'); }
function signedMoney(n){ return (Math.round(n||0) < 0 ? '−' : '') + money(Math.abs(n||0)); }
function moneyF(n){ return 'NT$' + (n||0).toLocaleString('zh-TW', {maximumFractionDigits:1}); }
function daysInMonthsOfYear(y){ let n=0; for(let m=1;m<=12;m++) n+=daysInMonth(y+'-'+String(m).padStart(2,'0')); return n; }
function daysInMonth(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function defaultState(){
  return {
    version: STATE_VERSION,
    categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
    members: ["Nimo", TREASURE_MEMBER],
    accounts: DEFAULT_ACCOUNTS.slice(),
    bankAccounts: DEFAULT_BANK_ACCOUNTS.slice(),
    banks: DEFAULT_BANKS.slice(),
    fixedItems: [],
    fixedIncomes: [],
    variableItems: [],
    dailyExpenses: [],
    incomes: []
  };
}

function setWarn(msg){
  const w = document.getElementById('warn');
  if(msg){ w.textContent = msg; w.hidden = false; } else { w.hidden = true; }
}

// In-page dialogs. The browser's own confirm()/alert() are blocked in some viewers
// (previews, in-app browsers) and would make a button silently do nothing.
function closeDialog(){
  const d = document.getElementById('dialog');
  d.hidden = true;
  d.innerHTML = '';
}
function askConfirm(message, yesLabel, onYes){
  const d = document.getElementById('dialog');
  d.innerHTML = `<div class="dlg-box" role="dialog" aria-modal="true">
    <p class="dlg-msg">${esc(message).replace(/\n/g,'<br>')}</p>
    <div class="dlg-actions">
      <button class="btn secondary" id="dlg-no" type="button">取消</button>
      <button class="btn" id="dlg-yes" type="button">${esc(yesLabel || '確定')}</button>
    </div></div>`;
  d.hidden = false;
  document.getElementById('dlg-no').onclick = closeDialog;
  document.getElementById('dlg-yes').onclick = ()=>{ closeDialog(); onYes(); };
}
function notice(message){
  const d = document.getElementById('dialog');
  d.innerHTML = `<div class="dlg-box" role="alertdialog" aria-modal="true">
    <p class="dlg-msg">${esc(message).replace(/\n/g,'<br>')}</p>
    <div class="dlg-actions"><button class="btn" id="dlg-yes" type="button">好</button></div></div>`;
  d.hidden = false;
  document.getElementById('dlg-yes').onclick = closeDialog;
}

// 固定花費／固定收入的欄位整理：
//  day = 日期（每月幾號，1–31，可空白）；startMonth = 從哪個月開始計入（新增當月，舊資料空白＝每個月都計入）
//  舊版把完整日期存在 date：轉成 startMonth + day
function normalizeFixed(r){
  if(!FREQS[r.freq]) r.freq = 'month';
  if(r.note == null) r.note = '';
  let legacyMonth = '';
  if(r.date != null){
    const m = String(r.date).match(/^(\d{4}-(\d{2}))(?:-(\d{2}))?$/);
    if(m){
      if(!r.startMonth) r.startMonth = m[1];
      if(m[3] && !(Array.isArray(r.days) && r.days.length)) r.days = [Number(m[3])];
      legacyMonth = Number(m[2]);
    }
    delete r.date;
  }
  if(r.day != null && r.day !== ''){                       // 上一版的單一「幾號」
    if(!(Array.isArray(r.days) && r.days.length)) r.days = [Number(r.day)];
  }
  delete r.day;
  const lo = r.freq === 'week' ? 0 : 1, hi = r.freq === 'week' ? 6 : 31;
  let days = (Array.isArray(r.days) ? r.days : []).map(Number).filter(d=>Number.isInteger(d) && d >= lo && d <= hi);
  days = Array.from(new Set(days));
  if(r.freq === 'year') days = days.slice(0,1);
  r.days = days.sort((x,y)=> (r.freq==='week' ? (x||7)-(y||7) : x-y));   // 週日(0)排最後
  const mo = Number(r.month);
  r.month = r.freq === 'year' ? (Number.isInteger(mo) && mo >= 1 && mo <= 12 ? mo : (legacyMonth || '')) : '';
  if(Array.isArray(r.revisions)) r.revisions.forEach(v=>{ v.n = Math.max(1, Number(v.n) || 1); v.days = Array.isArray(v.days) ? v.days.map(Number).filter(Number.isInteger) : []; });
  if(r.startMonth != null && !/^\d{4}-\d{2}$/.test(String(r.startMonth))) delete r.startMonth;
}
// 舊版的「固定月費」「年度花費」轉成統一格式
function legacyFixedToItems(list, freq){
  return (Array.isArray(list) ? list : []).filter(r=>r && typeof r === 'object' && r.id != null).map(r=>({
    id:String(r.id), category:String(r.category||''), item:String(r.item||''),
    amount:Number(r.amount)||0, freq, note:r.note != null ? String(r.note) : ''
  }));
}
// Older saves: convert them once.
function migrateState(legacy){
  if(state.version >= STATE_VERSION) return false;
  if(state.version < 2){
    state.dailyExpenses.forEach(r=>{
      if(!Array.isArray(r.members)) r.members = r.member ? [String(r.member)] : [];
      delete r.member;
      if(r.note == null) r.note = '';
    });
    if(!state.members.includes(TREASURE_MEMBER)) state.members.push(TREASURE_MEMBER);
  }
  // v3: 固定月費 + 年度花費 → 固定花費（加上頻率與備註）
  if(legacy){
    const have = new Set(state.fixedItems.map(r=>r.id));
    legacyFixedToItems(legacy.fixedMonthly, 'month').concat(legacyFixedToItems(legacy.annualItems, 'year')).forEach(r=>{
      if(!have.has(r.id)){ state.fixedItems.push(r); have.add(r.id); }
    });
  }
  state.fixedItems.concat(state.fixedIncomes).forEach(normalizeFixed);
  // v4: 帳戶別 / 銀行別選單（舊紀錄的帳戶欄位留空）
  if(!state.accounts.length) state.accounts = DEFAULT_ACCOUNTS.slice();
  if(!state.bankAccounts.includes(BANK_ACCOUNT)) state.bankAccounts.push(BANK_ACCOUNT);
  state.version = STATE_VERSION;
  return true;
}

function loadState(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }
  catch(e){ setWarn('這個瀏覽器不允許儲存網站資料（可能是無痕模式），記的帳無法保留。請改用一般瀏覽模式。'); }
  state = defaultState();
  let legacy = null;
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){
        const d = defaultState();
        for(const k in d){
          if(k === 'version') continue;
          const ok = LIST_KEYS.includes(k) || k === 'members' || k === 'accounts' || k === 'banks' || k === 'bankAccounts' ? Array.isArray(parsed[k]) : (parsed[k] && typeof parsed[k] === 'object');
          state[k] = ok ? parsed[k] : d[k];
        }
        state.version = Number(parsed.version) || 1;
        legacy = { fixedMonthly: parsed.fixedMonthly, annualItems: parsed.annualItems };
      }
    } catch(e){
      console.error('load failed', e);
      try{ localStorage.setItem(STORAGE_KEY + '-corrupt', raw); } catch(_){}
    }
  }
  if(migrateState(legacy)) saveState();
}

// Saves immediately on every change, so closing the page cannot lose anything.
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  } catch(e){
    console.error('save failed', e);
    setWarn('儲存失敗：這個瀏覽器不允許儲存網站資料，剛才記的帳不會保留。請改用一般瀏覽模式，或到設定匯出備份。');
    return false;
  }
}

function catOptions(selected){
  return Object.keys(state.categories).map(c =>
    `<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('');
}
function itemOptions(cat, selected){
  const items = state.categories[cat] || [];
  return items.map(i => `<option value="${esc(i)}" ${i===selected?'selected':''}>${esc(i)}</option>`).join('');
}
function memberOptions(selected){
  return state.members.map(m => `<option value="${esc(m)}" ${m===selected?'selected':''}>${esc(m)}</option>`).join('');
}
function memberOptionsBlank(selected){
  return `<option value="">（不指定）</option>` + memberOptions(selected);
}
function needsBank(account){ return state.bankAccounts.includes(account); }
function accountOptions(selected){
  return state.accounts.map(a => `<option value="${esc(a)}" ${a===selected?'selected':''}>${esc(a)}</option>`).join('');
}
function bankOptions(selected){
  return state.banks.map(b => `<option value="${esc(b)}" ${b===selected?'selected':''}>${esc(b)}</option>`).join('');
}
// 新增表單的「帳戶別」＋（選銀行時才出現的）「銀行別」

// ---------- 晴的寶庫：分攤計算 ----------
// A note that contains "1/n" anywhere (1/2, 1/3, 1/4 ...) means amount ÷ n and overrides the usual rate.
// Only a numerator of 1 counts, and the 1 must not be part of a longer number or date ("10/27", "2026/1/3").
function parseFraction(note){
  const m = String(note == null ? '' : note).match(/(?:^|[^\d\/／])1\s*[\/／]\s*(\d+)(?![\d\/／])/);
  if(!m) return null;
  const n = Number(m[1]);
  if(!(n >= 1)) return null;
  return { n };
}
function calcShare(r){
  const amt = Number(r.amount) || 0;
  const f = parseFraction(r.note);
  if(f) return { value: amt / f.n, rule: '備註 1/' + f.n };
  if(r.category === FOOD_CATEGORY) return { value: amt * FOOD_RATE, rule: '餐飲 ×' + FOOD_RATE };
  return { value: amt * DEFAULT_RATE, rule: '一般 ×' + DEFAULT_RATE };
}
function isTreasureRow(r){
  return Array.isArray(r.members) && r.members.includes(TREASURE_MEMBER);
}

// ---------- 固定花費／固定收入（每月 / 每週 / 每年） ----------
// 每筆可有「調整紀錄」revisions：[{from:'YYYY-MM', amount, freq}]，調整只從指定月份往後生效，過去的月份維持原值。
// startMonth 是開始計入的月份（新增當月）：之前的月份不計入；舊資料沒有就每個月都計入。day 只是每月幾號的日期欄。
// n＝每個週期發生幾次：每週／每月可複選多個日期（每個日期各算一次），每年固定 1 次
function nOf(r){
  if(r.freq === 'year') return 1;
  return Math.max(1, Array.isArray(r.days) ? r.days.length : 0);
}
function fixedDailyOf(r){
  const f = FREQS[r.freq] || FREQS.month;
  return Number(r.amount||0) * nOf(r) / f.days;
}
function fixedValueAt(r, ym){
  if(r.startMonth && String(r.startMonth) > ym) return null;
  const revs = Array.isArray(r.revisions) ? r.revisions : [];
  if(!revs.length) return { amount:Number(r.amount)||0, freq:FREQS[r.freq]?r.freq:'month', n:nOf(r), days:Array.isArray(r.days)?r.days.slice():[] };
  let pick = null;
  revs.forEach(v=>{ if(v.from <= ym) pick = v; });
  return pick ? { amount:Number(pick.amount)||0, freq:FREQS[pick.freq]?pick.freq:'month', n:Math.max(1, Number(pick.n)||1), days:Array.isArray(pick.days)?pick.days:[] } : null;
}
// 固定花費（總覽用）：每月＝金額（不會因為當月 28／31 天而變動）、每週＝金額 × 當月天數 ÷ 7、每年＝金額 ÷ 12
function fixedCostForMonth(ym){
  return state.fixedItems.reduce((s,r)=>{
    const v = fixedValueAt(r, ym);
    return v ? s + monthlyEquivalent(v, ym) : s;
  }, 0);
}
// 固定收入：每月＝金額、每週＝金額 × 當月天數 ÷ 7、每年＝金額 ÷ 12
// 這個月（依日曆）實際有幾天是所選的星期幾（0＝週日 … 6＝週六）
function countWeekdaysInMonth(ym, weekdays){
  const [y, m] = ym.split('-').map(Number);
  const dim = daysInMonth(ym);
  let c = 0;
  for(let d=1; d<=dim; d++){ if(weekdays.includes(new Date(y, m-1, d).getDay())) c++; }
  return c;
}
function monthlyEquivalent(v, ym){
  const n = v.n || 1;
  if(v.freq === 'week'){
    if(Array.isArray(v.days) && v.days.length) return v.amount * countWeekdaysInMonth(ym, v.days);   // 查日曆：該月實際有幾個週幾
    return v.amount * daysInMonth(ym) / 7;                                                            // 沒選星期：以當月天數 ÷ 7 估算
  }
  if(v.freq === 'year') return v.amount / 12;
  return v.amount * n;
}
function fixedIncomeForMonth(ym){
  const byType = {};
  let total = 0;
  state.fixedIncomes.forEach(r=>{
    const v = fixedValueAt(r, ym);
    if(!v) return;
    const x = monthlyEquivalent(v, ym);
    total += x;
    const t = (r.type || '其他') + '（固定）';
    byType[t] = (byType[t]||0) + x;
  });
  return { total, byType };
}
// 調整金額／頻率：從 effMonth 起套用，之前的月份保持原值
function reviseFixed(r, amount, freq, effMonth, n, days){
  days = Array.isArray(days) ? days : [];
  const sameDays = freq !== 'week' || (Array.isArray(r.days) ? r.days : []).join() === days.join();
  if(Number(r.amount) === amount && r.freq === freq && nOf(r) === n && sameDays) return;
  const base = r.startMonth ? String(r.startMonth) : '0000-00';
  let revs = Array.isArray(r.revisions) ? r.revisions.slice() : [];
  if(!revs.length) revs = [{ from:base, amount:Number(r.amount)||0, freq:FREQS[r.freq]?r.freq:'month', n:nOf(r), days:Array.isArray(r.days)?r.days.slice():[] }];
  revs.sort((x,y)=>x.from.localeCompare(y.from));
  if(effMonth <= revs[0].from){
    revs = [{ from:revs[0].from, amount, freq, n, days }];      // 生效月份不晚於起點：整段都是新值
  } else {
    revs = revs.filter(v=>v.from < effMonth);          // 之後（含同月）的舊調整被新值取代
    revs.push({ from:effMonth, amount, freq, n, days });
  }
  r.revisions = revs;
  r.amount = amount;
  r.freq = freq;
}
// ---- 日期選擇（仿「規律記帳時間」）：每週選星期、每月選日期（可複選、可全選）、每年選月＋日 ----
const WEEKDAYS = [['週一',1],['週二',2],['週三',3],['週四',4],['週五',5],['週六',6],['週日',0]];
function dayPickerInner(prefix, freq, r){
  const sel = r && Array.isArray(r.days) ? r.days.map(Number) : [];
  if(freq === 'year'){
    const mo = r && r.month ? Number(r.month) : '';
    let mOpts = '<option value="">（月）</option>', dOpts = '<option value="">（日）</option>';
    for(let i=1;i<=12;i++) mOpts += `<option value="${i}" ${i===mo?'selected':''}>${i} 月</option>`;
    for(let i=1;i<=31;i++) dOpts += `<option value="${i}" ${sel[0]===i?'selected':''}>${i} 日</option>`;
    return `<label>日期（每年幾月幾日）</label><div class="chk-list"><select id="${prefix}-month">${mOpts}</select><select id="${prefix}-yday">${dOpts}</select></div>`;
  }
  const items = freq === 'week' ? WEEKDAYS : Array.from({length:31}, (_,i)=>[(i+1)+' 日', i+1]);
  return `<label>日期（${freq==='week'?'每週星期幾':'每月幾日'}，可複選）</label>
    <div><button type="button" class="btn secondary small" id="${prefix}-allpick">全選</button></div>
    <div class="chk-list">${items.map(([t,v])=>
      `<label class="chk"><input type="checkbox" name="${prefix}-days" value="${v}" ${sel.includes(v)?'checked':''}>${t}</label>`).join('')}</div>`;
}
function mountDayPicker(prefix, freq, r){
  const box = document.getElementById(prefix + '-daypicker');
  box.innerHTML = dayPickerInner(prefix, freq, r);
  const all = document.getElementById(prefix + '-allpick');
  if(all) all.onclick = ()=>{
    const boxes = Array.from(document.querySelectorAll(`input[name="${prefix}-days"]`));
    const every = boxes.length > 0 && boxes.every(b=>b.checked);
    boxes.forEach(b=>{ b.checked = !every; });
  };
}
function readDayPicker(prefix, freq){
  if(freq === 'year'){
    const mo = Number(document.getElementById(prefix + '-month').value);
    const d = Number(document.getElementById(prefix + '-yday').value);
    return { days: Number.isInteger(d) && d >= 1 ? [d] : [], month: Number.isInteger(mo) && mo >= 1 ? mo : '' };
  }
  const days = Array.from(document.querySelectorAll(`input[name="${prefix}-days"]:checked`)).map(x=>Number(x.value));
  return { days, month: '' };
}
function fixedDaysLabel(r){
  const days = Array.isArray(r.days) ? r.days : [];
  if(r.freq === 'year') return r.month && days.length ? `${r.month} 月 ${days[0]} 日` : '—';
  if(!days.length) return '—';
  if(r.freq === 'week') return days.map(d=>(WEEKDAYS.find(w=>w[1]===d)||['?'])[0]).join('、');
  return days.length >= 28 ? `每月 ${days.length} 天` : days.map(d=>d+' 日').join('、');
}

// ---------- 存檔／分享：手機優先開分享選單，電腦直接下載 ----------
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  return 'downloaded';
}
function deliverFile(blob, filename){
  const ua = (navigator && navigator.userAgent) || '';
  const touch = /iPhone|iPad|iPod|Android/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  try{
    if(touch && typeof File === 'function' && navigator.canShare && navigator.share){
      const file = new File([blob], filename, { type: blob.type });
      if(navigator.canShare({ files: [file] })){
        return navigator.share({ files: [file], title: filename })
          .then(()=>'shared')
          .catch(e=> (e && e.name === 'AbortError') ? 'cancelled' : downloadBlob(blob, filename));
      }
    }
  } catch(e){}
  return Promise.resolve(downloadBlob(blob, filename));
}

// ---------- 匯出 Excel（.xlsx，自己打包，不需要外部程式庫） ----------
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const CRC_TABLE = (()=>{
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n] = c>>>0; }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// A zip with the files stored as they are (no compression), which is all .xlsx needs.
function buildZip(files){
  const enc = new TextEncoder();
  const now = new Date();
  const dosTime = (now.getHours()<<11) | (now.getMinutes()<<5) | (now.getSeconds()>>1);
  const dosDate = ((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate();
  const chunks = [], central = [];
  let offset = 0;
  files.forEach(f=>{
    const name = enc.encode(f.name);
    const crc = crc32(f.data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,dosTime,true); lh.setUint16(12,dosDate,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,f.data.length,true); lh.setUint32(22,f.data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,dosTime,true); ch.setUint16(14,dosDate,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,f.data.length,true); ch.setUint32(24,f.data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + f.data.length;
  });
  let cdSize = 0;
  central.forEach(c=>{ cdSize += c.length; });
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
  const all = chunks.concat(central, [new Uint8Array(end.buffer)]);
  let total = 0;
  all.forEach(c=>{ total += c.length; });
  const out = new Uint8Array(total);
  let p = 0;
  all.forEach(c=>{ out.set(c,p); p += c.length; });
  return out;
}

function xmlText(s){ return esc(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,''); }
function cStr(ref, text, style){
  return `<c r="${ref}"${style?` s="${style}"`:''} t="inlineStr"><is><t xml:space="preserve">${xmlText(text)}</t></is></c>`;
}
// A number cell; with a formula it also carries the calculated value, so apps that do not recalculate still show it.
function cNum(ref, v, style, formula){
  return `<c r="${ref}"${style?` s="${style}"`:''}>${formula?`<f>${xmlText(formula)}</f>`:''}<v>${Number.isFinite(v)?v:0}</v></c>`;
}

// The factor a row was settled with, read back from the rule saved at 分攤 time.
function coefOf(r){
  const rule = String(r.splitRule || '');
  let m = rule.match(/^備註 1\/(\d+)$/);
  if(m) return { value: 1/Number(m[1]), formula: '1/' + m[1] };
  m = rule.match(/×\s*([0-9.]+)$/);
  if(m) return { value: Number(m[1]), formula: null };
  const amt = Number(r.amount) || 0;
  return { value: amt ? Number(r.splitAmount||0)/amt : 0, formula: null };
}

function buildTreasureXlsx(rows){
  const enc = new TextEncoder();
  const heads = ['分攤日期','花費日期','成員','類別','項目','備註','金額','計算規則','係數','晴要給 Nimo'];
  const cols = 'ABCDEFGHIJ';
  let data = `<row r="1">${heads.map((h,i)=>cStr(cols[i]+'1', h, 1)).join('')}</row>`;
  let sumAmt = 0, sumShare = 0;
  rows.forEach((r,idx)=>{
    const n = idx + 2;
    const c = coefOf(r);
    const amt = Number(r.amount) || 0;
    const share = Number(r.splitAmount) || 0;
    sumAmt += amt; sumShare += share;
    data += `<row r="${n}">` +
      cStr('A'+n, r.splitDate) + cStr('B'+n, r.date) + cStr('C'+n, (r.members||[]).join('、')) +

      cNum('G'+n, amt, 2) + cStr('H'+n, r.splitRule || '') +
      cNum('I'+n, c.value, 3, c.formula) +

  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +

    `<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>` +
    `<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>` +
    `<fill><patternFill patternType="solid"><fgColor rgb="FFEDE7D6"/><bgColor indexed="64"/></patternFill></fill></fills>` +
    `<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>` +
    `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>` +
    `<cellXfs count="6">` +
    `<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>` +
    `<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>` +
    `<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>` +
    `<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>` +
    `<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>` +

  const head = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`;

// date = one 分攤 day, or null for everything that has been settled
function exportTreasureExcel(date){
  const rows = state.dailyExpenses
    .filter(r=>isTreasureRow(r) && r.splitDate && (!date || r.splitDate === date))
    .sort((a,b)=> String(a.splitDate).localeCompare(String(b.splitDate)) || String(a.date).localeCompare(String(b.date)));
  if(!rows.length){ setTreasureMsg('還沒有已分攤的交易可以匯出'); return; }
  const total = rows.reduce((s,r)=>s+(Number(r.splitAmount)||0),0);
  const blob = new Blob([buildTreasureXlsx(rows)], { type: XLSX_MIME });
  const name = '晴的分攤-' + (date || todayStr()) + '.xlsx';
  const summary = rows.length + ' 筆，分攤總金額 ' + moneyF(total);
  deliverFile(blob, name).then(res=>{
    if(res === 'cancelled') return;
    setTreasureMsg(res === 'shared'
      ? '已開啟分享選單，請選「儲存到檔案」或傳給自己（' + summary + '）'
      : '已匯出 Excel（' + summary + '）');
  });
}

// ---------- 總覽與建議 ----------
let overviewMonth = thisMonthStr();
let overviewMode = 'month';            // 'month' | 'year'
let overviewYear = thisMonthStr().slice(0,4);
function variableDailyNow(){
  return state.variableItems.reduce((s,r)=>{
    if(r.nextBuyDate){
      const days = (new Date(r.nextBuyDate) - new Date(r.buyDate)) / 86400000;
      if(days > 0) return s + Number(r.amount)/days;
    }
    return s;
  },0);
}
// 某個月的固定支出（依當時生效的金額）＋ 彈性消耗品，以及固定收入
function monthRecurring(ym, variableDaily){
  return fixedCostForMonth(ym) + variableDaily * daysInMonth(ym);
}
function monthsOf(prefix){
  return prefix.length === 4 ? Array.from({length:12}, (_,i)=> prefix + '-' + String(i+1).padStart(2,'0')) : [prefix];
}
function renderOverviewTab(){
  const isYear = overviewMode === 'year';
  const prefix = isYear ? overviewYear : overviewMonth;
  const label = isYear ? overviewYear + ' 年' : overviewMonth;
  const periodWord = isYear ? '這一年' : '這個月';
  const periodDays = isYear ? (daysInMonthsOfYear(overviewYear)) : daysInMonth(overviewMonth);
  const sum = list => list.reduce((s,r)=>s+Number(r.amount||0),0);

  const variableDaily = variableDailyNow();
  const periodMonths = monthsOf(prefix);
  const recurringTotal = periodMonths.reduce((s,ym)=> s + monthRecurring(ym, variableDaily), 0);
  const recurringDailyTotal = recurringTotal / periodDays;
  const fixedInc = periodMonths.reduce((acc,ym)=>{
    const x = fixedIncomeForMonth(ym);
    acc.total += x.total;
    Object.entries(x.byType).forEach(([t,v])=>{ acc.byType[t] = (acc.byType[t]||0) + v; });
    return acc;
  }, { total:0, byType:{} });

  const monthDaily = state.dailyExpenses.filter(r=>String(r.date).startsWith(prefix));
  const monthDailyTotal = sum(monthDaily);
  const monthExpenseEstimate = recurringTotal + monthDailyTotal;

  const monthIncomes = state.incomes.filter(r=>String(r.date).startsWith(prefix));
  const monthIncomeTotal = sum(monthIncomes) + fixedInc.total;

  const savings = monthIncomeTotal - monthExpenseEstimate;
  const ratio = monthIncomeTotal>0 ? savings/monthIncomeTotal : null;

  // income breakdown by type
  const incomeByType = {};
  monthIncomes.forEach(r=>{ incomeByType[r.type] = (incomeByType[r.type]||0) + Number(r.amount); });
  Object.entries(fixedInc.byType).forEach(([t,v])=>{ incomeByType[t] = (incomeByType[t]||0) + v; });

  // member breakdown for daily expenses: a shared expense is split equally between its members
  const memberSpend = {};
  monthDaily.forEach(r=>{
    const ms = Array.isArray(r.members) && r.members.length ? r.members : ['未指定'];
    const share = Number(r.amount||0) / ms.length;
    ms.forEach(m=>{ memberSpend[m] = (memberSpend[m]||0) + share; });
  });

  // 年度選單：涵蓋有資料的年份，並預留前 2 年到後 30 年，跟月份選單一樣可以看到明年
  const thisYear = Number(thisMonthStr().slice(0,4));
  let lo = thisYear - 2, hi = thisYear + 30;
  state.dailyExpenses.concat(state.incomes).forEach(r=>{
    const y = Number(String(r.date||'').slice(0,4));
    if(y >= 1900 && y <= 2200){ lo = Math.min(lo, y); hi = Math.max(hi, y); }
  });
  lo = Math.min(lo, Number(overviewYear)); hi = Math.max(hi, Number(overviewYear));
  let yearOpts = '';
  for(let y = lo; y <= hi; y++) yearOpts += `<option value="${y}" ${String(y)===overviewYear?'selected':''}>${y} 年</option>`;

  let html = `<h2>總覽與建議</h2>
  <p class="hint">固定收入、固定花費、彈性消耗品只要設定一次，之後每個月都會自動套用（調整只往後生效，過去月份不變）；每日花費和收入依你選的${isYear?'年度':'月份'}自動彙整。</p>
  <div class="add-row" style="border-top:none;padding-top:0;margin-bottom:12px;">
    <div class="field"><label>檢視方式</label><select id="view-mode"><option value="month" ${isYear?'':'selected'}>月份</option><option value="year" ${isYear?'selected':''}>年度</option></select></div>
    ${isYear
      ? `<div class="field"><label>檢視年度</label><select id="year-pick">${yearOpts}</select></div>`
      : `<div class="field"><label>檢視月份</label><input type="month" id="month-pick" value="${overviewMonth}"></div>`}
  </div>`;

  html += `<div class="grid2">
    <div class="stat"><div class="label">${label} 收入合計</div><div class="value">${money(monthIncomeTotal)}</div></div>
    <div class="stat"><div class="label">${label} 支出估計</div><div class="value">${money(monthExpenseEstimate)}</div></div>
    <div class="stat"><div class="label">${label} 淨額（收入－支出）</div><div class="value" id="net-value" style="color:${savings<0?'var(--red)':'var(--green-deep)'};">${signedMoney(savings)}</div></div>
    <div class="stat"><div class="label">固定花費＋消耗品（每日）</div><div class="value">${moneyF(recurringDailyTotal)}</div></div>
    <div class="stat"><div class="label">${isYear?'全年':'當月'}已記錄花費</div><div class="value">${money(monthDailyTotal)}</div></div>
  </div>`;

  let adviceClass = 'advice', adviceText;
  if(monthIncomeTotal===0){
    adviceText = periodWord + '還沒有收入紀錄，先到「收入」分頁記一筆，才能算儲蓄比例。';
  } else if(ratio<0){
    adviceClass += ' warn';
    adviceText = `⚠️ ${periodWord}支出已經超過收入 ${money(-savings)}，建議先檢視「每日花費」和「彈性消耗品」有沒有能縮減的項目。`;
  } else if(ratio<0.2){
    adviceClass += ' warn';
    adviceText = `⚠️ ${periodWord}儲蓄比例約 ${(ratio*100).toFixed(1)}%，低於 20%，可以檢視非必要支出，看看哪些能減少。`;
  } else {
    adviceClass += ' good';
    adviceText = `✅ ${periodWord}儲蓄比例約 ${(ratio*100).toFixed(1)}%，狀況良好，可以考慮增加投資或緊急預備金。`;
  }
  html += `<div class="${adviceClass}">${adviceText}</div>`;
  html += `<p class="note">參考原則：50/30/20 預算法（50%必要支出、30%生活享受、20%儲蓄投資）－一般理財常見原則，僅供參考，非個人化建議。</p>`;

  // income breakdown
  html += `<h2 style="margin-top:26px;">收入明細（依類型）</h2>`;
  if(Object.keys(incomeByType).length===0){
    html += `<p class="empty">${periodWord}尚無收入紀錄</p>`;
  } else {
    html += `<table><tbody>`;
    Object.entries(incomeByType).forEach(([t,v])=>{
      html += `<tr><td>${esc(t)}</td><td class="num">${money(v)}</td></tr>`;
    });
    html += `</tbody></table>`;
  }

  // member breakdown
  html += `<h2 style="margin-top:10px;">每日花費（依成員）</h2>
  <p class="hint" style="margin-bottom:8px;">一筆花費勾了多位成員時，金額平均分給每個人。</p>`;
  if(Object.keys(memberSpend).length===0){
    html += `<p class="empty">${periodWord}尚無每日花費紀錄</p>`;
  } else {
    html += `<table><tbody>`;
    Object.entries(memberSpend).forEach(([m,v])=>{
      html += `<tr><td>${esc(m)}</td><td class="num">${money(v)}</td></tr>`;
    });
    html += `</tbody></table>`;
  }

  if(isYear){
    // 12 個月的逐月明細
    html += `<h2 style="margin-top:26px;">${overviewYear} 年逐月明細</h2>
    <table><thead><tr><th>月份</th><th class="num">收入</th><th class="num">每日花費</th><th class="num">固定＋消耗品</th><th class="num">支出估計</th><th class="num">淨額</th></tr></thead><tbody>`;
    let tInc=0, tDaily=0, tRec=0;
    for(let m=1;m<=12;m++){
      const ym = overviewYear + '-' + String(m).padStart(2,'0');
      const inc = sum(state.incomes.filter(r=>String(r.date).startsWith(ym))) + fixedIncomeForMonth(ym).total;
      const dl = sum(state.dailyExpenses.filter(r=>String(r.date).startsWith(ym)));
      const rc = monthRecurring(ym, variableDaily);
      tInc+=inc; tDaily+=dl; tRec+=rc;
      html += `<tr><td>${m} 月</td><td class="num">${money(inc)}</td><td class="num">${money(dl)}</td><td class="num">${money(rc)}</td><td class="num">${money(dl+rc)}</td><td class="num">${signedMoney(inc-dl-rc)}</td></tr>`;
    }
    html += `<tr class="total-row"><td>全年</td><td class="num">${money(tInc)}</td><td class="num">${money(tDaily)}</td><td class="num">${money(tRec)}</td><td class="num">${money(tDaily+tRec)}</td><td class="num">${signedMoney(tInc-tDaily-tRec)}</td></tr></tbody></table>`;
  }

  document.getElementById('content').innerHTML = html;
  document.getElementById('view-mode').onchange = (e)=>{
    overviewMode = e.target.value === 'year' ? 'year' : 'month';
    if(overviewMode === 'year') overviewYear = overviewMonth.slice(0,4);
    renderOverviewTab();
  };
  if(isYear){
    document.getElementById('year-pick').onchange = (e)=>{
      if(!e.target.value) return;
      overviewYear = e.target.value;
      renderOverviewTab();
    };
  } else {
    document.getElementById('month-pick').onchange = (e)=>{
      if(!e.target.value) return;
      overviewMonth = e.target.value;
      renderOverviewTab();
    };
  }
}

// ---------- 備份：匯出與匯入 ----------
function cleanRecord(r){
  const out = { id: String(r.id) };
  ['category','item','date','member','type','note','buyDate','nextBuyDate','freq','account','bank','startMonth'].forEach(k=>{
    if(r[k] != null) out[k] = String(r[k]);
  });
  out.amount = Number(r.amount) || 0;
  if(Array.isArray(r.days)) out.days = r.days.map(Number).filter(Number.isInteger);
  if(r.day != null && r.day !== '') out.day = Number(r.day);
  if(r.month != null && r.month !== '') out.month = Number(r.month);
  if(Array.isArray(r.revisions)){
    out.revisions = r.revisions.filter(v=>v && typeof v === 'object' && /^\d{4}-\d{2}$/.test(String(v.from)))
      .map(v=>({ from:String(v.from), amount:Number(v.amount)||0, freq:FREQS[v.freq]?v.freq:'month', n:Math.max(1, Number(v.n)||1), days:Array.isArray(v.days)?v.days.map(Number).filter(Number.isInteger):[] }))
      .sort((a,b)=>a.from.localeCompare(b.from));
  }
  return out;
}
// Daily expenses carry a members list, a note and the split result.
function cleanDaily(r){
  const out = cleanRecord(r);
  delete out.member;
  const list = Array.isArray(r.members) ? r.members : (r.member ? [r.member] : []);
  out.members = list.filter(m=>typeof m === 'string' && m);
  out.note = r.note != null ? String(r.note) : '';
  if(r.splitDate){
    out.splitDate = String(r.splitDate);
    out.splitAmount = Number(r.splitAmount) || 0;
    out.splitRule = r.splitRule != null ? String(r.splitRule) : '';
  }
  return out;
}

// Imported records are added; anything already here is kept. Nothing is overwritten or deleted.
function mergeImported(data){
  let added = 0;
  // 舊版備份：固定月費 / 年度花費 → 固定花費
  if(data && (Array.isArray(data.fixedMonthly) || Array.isArray(data.annualItems))){
    const have = new Set(state.fixedItems.map(r=>r.id));
    legacyFixedToItems(data.fixedMonthly,'month').concat(legacyFixedToItems(data.annualItems,'year')).forEach(r=>{
      if(!have.has(r.id)){ state.fixedItems.push(r); have.add(r.id); added++; }
    });
  }
  LIST_KEYS.forEach(k=>{
    const incoming = data && Array.isArray(data[k]) ? data[k] : [];
    const have = new Set(state[k].map(r=>r.id));
    incoming.forEach(r=>{
      if(r && typeof r === 'object' && r.id != null && !have.has(String(r.id))){
        state[k].push(k === 'dailyExpenses' ? cleanDaily(r) : cleanRecord(r));
        have.add(String(r.id));
        added++;
      }
    });
  });
  state.fixedItems.concat(state.fixedIncomes).forEach(normalizeFixed);
  if(data && Array.isArray(data.members)){
    data.members.forEach(m=>{
      if(typeof m === 'string' && m && !state.members.includes(m)) state.members.push(m);
    });
  }
  ['accounts','banks','bankAccounts'].forEach(k=>{
    if(data && Array.isArray(data[k])){
      data[k].forEach(v=>{
        if(typeof v === 'string' && v && !state[k].includes(v)) state[k].push(v);
      });
    }
  });
  if(data && data.categories && typeof data.categories === 'object'){
    Object.keys(data.categories).forEach(c=>{
      const items = Array.isArray(data.categories[c]) ? data.categories[c] : [];
      if(!state.categories[c]) state.categories[c] = [];
      items.forEach(i=>{
        if(typeof i === 'string' && i && !state.categories[c].includes(i)) state.categories[c].push(i);
      });
    });
  }
  return added;
}

function exportBackup(){
  const blob = new Blob([JSON.stringify({ app:'budget-app', version:STATE_VERSION, exportedAt:new Date().toISOString(), state:state }, null, 2)], { type:'application/json' });
  const n = LIST_KEYS.reduce((s,k)=>s+state[k].length,0);
  deliverFile(blob, 'budget-backup-' + todayStr() + '.json').then(res=>{
    if(res === 'cancelled') return;
    setBackupMsg(res === 'shared'
      ? '已開啟分享選單，請選「儲存到檔案」保存備份（共 ' + n + ' 筆紀錄）'
      : '已匯出備份檔（共 ' + n + ' 筆紀錄）');
  });
}

function setBackupMsg(t){
  const el = document.getElementById('backup-msg');
  if(el) el.textContent = t;
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(String(reader.result));
      const data = parsed && parsed.state ? parsed.state : parsed;
      if(!data || typeof data !== 'object') throw new Error('bad file');
      const added = mergeImported(data);
      const ok = saveState();
      render();
      setBackupMsg(ok ? ('已匯入，新增 ' + added + ' 筆紀錄，並已儲存') : '匯入成功，但這個瀏覽器不允許儲存網站資料');
    } catch(e){
      setBackupMsg('無法讀取這個檔案，請選擇之前匯出的備份檔');
    }
  };
  reader.onerror = ()=> setBackupMsg('讀取檔案失敗');
  reader.readAsText(file);
}

// ---------- 設定 ----------

  html += `<div class="settings-block">
    <h2 style="font-size:15px;">資料備份</h2>
    <p class="hint" style="margin-bottom:10px;">資料只存在這個瀏覽器。換手機、換瀏覽器或清除網站資料前，請先匯出備份；在新的地方匯入，就會把紀錄加進去（不會覆蓋或刪除原有的）。</p>
    <div class="add-row" style="border-top:none;padding-top:0;">
      <button class="btn" id="export-btn" type="button">匯出備份</button>
      <button class="btn secondary" id="import-btn" type="button">匯入備份</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
    <div class="backup-msg" id="backup-msg"></div>
  </div>`;

  html += `<div class="settings-block">
    <h2 style="font-size:15px;">使用成員</h2>
    <div class="chip-list">${state.members.map(m=>
      `<span class="chip">${esc(m)}<button data-del-member="${esc(m)}">✕</button></span>`).join('') || '<span class="empty">尚無成員</span>'}</div>
    <div class="add-row">
      <div class="field"><label>新增成員</label><input type="text" id="new-member-name" placeholder="例如：媽媽"></div>
      <button class="btn secondary" id="add-member-btn">新增</button>
    </div>
  </div>`;

  html += `<div class="settings-block">
    <h2 style="font-size:15px;">帳戶別</h2>
    <p class="hint" style="margin-bottom:8px;">新增花費、收入時的「帳戶別」下拉選單。標示「需選銀行別」的帳戶（預設：銀行、信用卡、行動支付），選到時會再出現銀行別選單；點該標籤可開關。「${BANK_ACCOUNT}」固定需選銀行別，不能刪除。已記的紀錄不受影響。</p>
    <div class="chip-list">${state.accounts.map(a=>
      `<span class="chip">${esc(a)}${a===BANK_ACCOUNT
        ? ' <small>（需選銀行別）</small>'
        : ` <button data-toggle-bank="${esc(a)}" title="開關是否需選銀行別">${needsBank(a)?'需選銀行別 ✓':'不需銀行別'}</button><button data-del-account="${esc(a)}">✕</button>`}</span>`).join('') || '<span class="empty">尚無帳戶別</span>'}</div>
    <div class="add-row">
      <div class="field"><label>新增帳戶別</label><input type="text" id="new-account-name" placeholder="例如：悠遊卡"></div>
      <button class="btn secondary" id="add-account-btn">新增</button>
    </div>
  </div>`;

  html += `<div class="settings-block">
    <h2 style="font-size:15px;">銀行別</h2>
    <div class="chip-list">${state.banks.map(b=>
      `<span class="chip">${esc(b)}<button data-del-bank="${esc(b)}">✕</button></span>`).join('') || '<span class="empty">尚無銀行別</span>'}</div>
    <div class="add-row">
      <div class="field"><label>新增銀行別</label><input type="text" id="new-bank-name" placeholder="例如：第一銀行"></div>
      <button class="btn secondary" id="add-bank-btn">新增</button>
    </div>
  </div>`;

  html += `<div class="settings-block">
    <h2 style="font-size:15px;">類別與細項</h2>`;
  Object.entries(state.categories).forEach(([cat, items])=>{
    html += `<div style="margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <strong>${esc(cat)}</strong>
        <button class="del-btn" data-del-cat="${esc(cat)}">刪除整個類別</button>
      </div>
      <div class="chip-list">
        ${items.map(i=>`<span class="chip">${esc(i)}<button data-del-item="${esc(cat)}|${esc(i)}">✕</button></span>`).join('') || '<span class="empty">尚無細項</span>'}
      </div>
      <div class="add-row" style="border-top:none;padding-top:0;">
        <input type="text" placeholder="新增細項" data-new-item-input="${esc(cat)}" style="max-width:160px;">
        <button class="btn secondary" data-new-item-btn="${esc(cat)}">新增細項</button>
      </div>
    </div>`;
  });
  html += `<div class="add-row">
    <div class="field"><label>新增類別</label><input type="text" id="new-cat-name" placeholder="例如：寵物"></div>
    <button class="btn" id="add-cat-btn">新增類別</button>
  </div>`;
  html += `</div>`;

  document.getElementById('content').innerHTML = html;

  document.getElementById('export-btn').onclick = exportBackup;
  document.getElementById('import-btn').onclick = ()=> document.getElementById('import-file').click();
  document.getElementById('import-file').onchange = (e)=>{
    const f = e.target.files && e.target.files[0];
    if(f) importBackupFile(f);
    e.target.value = '';
  };

  document.getElementById('add-member-btn').onclick = ()=>{
    const v = document.getElementById('new-member-name').value.trim();
    if(!v) return;
    if(!state.members.includes(v)) state.members.push(v);
    saveState();
    render();
  };
  document.querySelectorAll('[data-del-member]').forEach(b=>{
    b.onclick = ()=>{
      state.members = state.members.filter(m=>m!==b.dataset.delMember);
      saveState();
      render();
    };
  });
  document.getElementById('add-account-btn').onclick = ()=>{
    const v = document.getElementById('new-account-name').value.trim();
    if(!v) return;
    if(!state.accounts.includes(v)) state.accounts.push(v);
    saveState();
    render();
  };
  document.querySelectorAll('[data-del-account]').forEach(b=>{
    b.onclick = ()=>{
      state.accounts = state.accounts.filter(a=>a!==b.dataset.delAccount);
      state.bankAccounts = state.bankAccounts.filter(a=>a!==b.dataset.delAccount);
      saveState();
      render();
    };
  });
  document.querySelectorAll('[data-toggle-bank]').forEach(b=>{
    b.onclick = ()=>{
      const a = b.dataset.toggleBank;
      state.bankAccounts = needsBank(a) ? state.bankAccounts.filter(x=>x!==a) : state.bankAccounts.concat(a);
      saveState();
      render();
    };
  });
  document.getElementById('add-bank-btn').onclick = ()=>{
    const v = document.getElementById('new-bank-name').value.trim();
    if(!v) return;
    if(!state.banks.includes(v)) state.banks.push(v);
    saveState();
    render();
  };
  document.querySelectorAll('[data-del-bank]').forEach(b=>{
    b.onclick = ()=>{
      state.banks = state.banks.filter(x=>x!==b.dataset.delBank);
      saveState();
      render();
    };
  });
  document.getElementById('add-cat-btn').onclick = ()=>{
    const v = document.getElementById('new-cat-name').value.trim();
    if(!v) return;
    if(!state.categories[v]) state.categories[v] = [];
    saveState();
    render();
  };
  document.querySelectorAll('[data-del-cat]').forEach(b=>{
    b.onclick = ()=>{
      const cat = b.dataset.delCat;
      askConfirm(`確定要刪除「${cat}」這個類別嗎？`, '刪除', ()=>{
        delete state.categories[cat];
        saveState();
        render();
      });
    };
  });
  document.querySelectorAll('[data-del-item]').forEach(b=>{
    b.onclick = ()=>{
      const sep = b.dataset.delItem.indexOf('|');
      const cat = b.dataset.delItem.slice(0, sep);
      const item = b.dataset.delItem.slice(sep+1);
      state.categories[cat] = (state.categories[cat] || []).filter(i=>i!==item);
      saveState();
      render();
    };
  });
  document.querySelectorAll('[data-new-item-btn]').forEach(b=>{
    b.onclick = ()=>{
      const cat = b.dataset.newItemBtn;
      const input = Array.from(document.querySelectorAll('[data-new-item-input]')).find(x=>x.dataset.newItemInput===cat);
      const v = input ? input.value.trim() : '';
      if(!v) return;
      if(!state.categories[cat].includes(v)) state.categories[cat].push(v);
      saveState();
      render();
    };
  });
}

function render(){
  renderTabs();
  if(activeTab==='overview') renderOverviewTab();
  else if(activeTab==='fixed') renderFixedListTab('fixedItems');
  else if(activeTab==='fixedIncome') renderFixedListTab('fixedIncomes');
  else if(activeTab==='variable') renderVariableTab();
  else if(activeTab==='daily') renderDailyTab();
  else if(activeTab==='income') renderIncomeTab();
  else if(activeTab==='treasure') renderTreasureTab();
  else if(activeTab==='settings') renderSettingsTab();
}

// Ask the browser not to clear this page's data when space runs low.
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}

// Safety net: save again when the page is hidden or closed.
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && state) saveState(); });
window.addEventListener('pagehide', ()=>{ if(state) saveState(); });

loadState();
render();
</script>
